<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<script type="text/javascript">
	let goWriteForm = function() {
		location.href = "/board-mvc/board/write"
	}
</script>
</head>
<body>
	<h2>전체 게시글 조회</h2>

	<table border="1">
		<tr>
			<th>번호</th>
			<th>제목</th>
			<th>작성자</th>
			<th>등록일</th>
		</tr>
		<tr th:each="board : ${boardList}">
			<td th:text="${ board.no }">123</td>
			<td>
				<!-- <a th:text="${ board.title}" th:href="@{/board/detail?no={no} (no=${board.no})}"></a> -->
				<!-- <a th:text="${ board.title}" th:href="@{/board/{no} (no=${board.no})}"></a> -->
				<!-- 로그인이 되어있는 경우 => 상세페이지 이동, 로그인 안되어있는 경우 => 로그인 페이지 이동 -->
				<a th:text="${ board.title}" 
					th:href="${session.userVO != null} ? @{/board/{no} (no=${board.no})} : @{/login}">
				</a>
			</td>
			<td th:text="${ board.writer}">윤길동</td>
			<td th:text="${ board.regDate}">2026-08-26</td>
		</tr>
		
	</table>
		<a th:if="${pageVO.hasPrevBlock}" th:href="@{/board(page=${pageVO.startPage - 1})}">이전5</a>

		<span th:each="p : ${#numbers.sequence(pageVO.startPage, pageVO.endPage)}">
			&nbsp;
			<a th:if="${p != pageVO.currentPage}" th:text="${p}" th:href="@{/board(page=${p})}"></a>
			<b th:if="${p == pageVO.currentPage}" th:text="${p}"></b>
			&nbsp;
		</span>
	
		<a th:if="${pageVO.hasNextBlock}" th:href="@{/board(page=${pageVO.endPage + 1})}">다음5</a>
	<br>
	<span th:if="${session.userVO != null}">
	<button onclick="goWriteForm()">새글등록</button>
	</span>
</body>
</html>
