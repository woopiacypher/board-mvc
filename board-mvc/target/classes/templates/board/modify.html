<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>게시글 수정</title>
<style>
	.error {
		color: red;
		font-size: 0.7em;
		font-style: italic;
	}
</style>
</head>
<body>
	<h2>게시글 수정</h2>
	<hr>
	<form th:object="${boardVO}" th:action="@{/board/modify/{no}(no=${boardVO.no})}" method="post">
		<input type="hidden" th:field="*{writer}">
		<table border="1">
			<tr>
				<th>번호</th>
				<td th:text="${boardVO.no}"></td>
			</tr>
			<tr>
				<th>제목</th>
				<td>
					<input type="text" th:field="*{title}">
					<span th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="error"></span>
				</td>
			</tr>
			<tr>
				<th>작성자</th>
				<td th:text="${boardVO.writer}"></td>
			</tr>
			<tr>
				<th>내용</th>
				<td>
					<textarea rows="5" cols="40" th:field="*{content}"></textarea>
					<span th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="error"></span>
				</td>
			</tr>
		</table>
		<br>
		<button>수정완료</button>
	</form>
</body>
</html>
